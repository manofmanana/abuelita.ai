{% load i18n %}
{% get_current_language as LANGUAGE_CODE %}
{% get_available_languages as LANGUAGES %}
<form action="{% url 'set_language' %}" method="post" class="lang-form d-flex align-items-center gap-2">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}" />
  <label class="visually-hidden" for="lang-select">{% trans "Language" %}</label>
  <select id="lang-select" name="language" class="form-select form-select-sm lang-select" data-autosubmit>
    {% for lang_code, lang_name in LANGUAGES %}
    <option value="{{ lang_code }}" {% if lang_code == LANGUAGE_CODE %}selected{% endif %}>{% if lang_code == 'en' %}🇺🇸{% else %}🇲🇽{% endif %} {{ lang_name }}</option>
    {% endfor %}
  </select>
  <noscript><button type="submit" class="btn btn-sm btn-light">{% trans "Go" %}</button></noscript>
</form>
